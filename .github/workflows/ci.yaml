name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: open-meteo-rs-amd64
    env:
      USER: runner

    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
        with:
          enable_kvm: false
          nix_conf: |
            sandbox = false

      - name: Run fmt check
        run: nix develop --command make fmt-check

      - name: Run clippy checks
        run: nix develop --command make clippy

      - name: Run tests
        run: nix develop --command make test

      - name: Run cargo-deny
        run: nix develop --command make deny
