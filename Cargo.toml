[package]
name = "open-meteo-rs"
version = "0.2.0"
edition = "2024"
homepage = "https://github.com/angelodlfrtr/open-meteo-rs"
license-file = "LICENSE.txt"
repository = "https://github.com/angelodlfrtr/open-meteo-rs"
rust-version = "1.88"
description = "HTTP client for open-meteo.com api"

[dependencies]
jiff = { version = "0.2.37", default-features = false, features = ["std", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "query", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
futures = "0.3.31"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
